name: Godot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate project & build Web export
    runs-on: ubuntu-latest
    # barichello/godot-ci 已内置对应版本的 Godot 与导出模板
    # 如需更换 Godot 版本，把镜像标签改为对应版本（如 4.7 / 4.6.3）即可
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import & sanity-check (editor must load without errors)
        run: godot --headless --editor --quit --path .

      - name: Web export (release)
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # 同一 godot-ci 镜像：内置 Godot、导出模板与 Android SDK（含 gradle 构建所需）
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android (debug, gradle)
        # 全新 checkout 无 android/build 目录，Godot 会在导出时自动解压并安装
        # Android 构建模板（写入正确的 .build_version），从而绕开本地手动解压会踩的坑。
        # use_gradle_build=true 时包名取自 export_presets.cfg 的 package_name，
        # 产出即 com.yzj_workspace.rougelikesurvivors（而非派生包名）。
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/rougelike_debug.apk

      - name: Verify APK package name
        run: |
          PKG=$(aapt2 dump badging build/android/rougelike_debug.apk 2>/dev/null | grep -oE "package: name='[^']+'" | head -1)
          echo "APK: $PKG"
          echo "$PKG" | grep -q "com.yzj_workspace.rougelikesurvivors" && echo "OK: 精确包名生效" || echo "WARN: 包名非预期"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/rougelike_debug.apk
          retention-days: 14
